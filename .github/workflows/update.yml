name: Publish redirect

# The catalogue now lives on the WordPress site, where the plugin refreshes it
# from Zotero every week. GitHub Pages only serves docs/index.html, which sends
# old links (including #record anchors) to the WordPress catalogue page.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
